services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: marmara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: marmara
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://marmara:${POSTGRES_PASSWORD}@postgres:5432/marmara
      SOCKET_INTERNAL_URL: http://socket:3001
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - postgres
      - socket
    ports:
      - "127.0.0.1:3000:3000"

  socket:
    build: .
    command: ["npm", "run", "start:socket"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://marmara:${POSTGRES_PASSWORD}@postgres:5432/marmara
      NODE_ENV: production
    depends_on:
      - postgres

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
      - socket

volumes:
  postgres_data:
  certbot_www:
  certbot_conf:
